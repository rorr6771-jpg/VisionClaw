name: Compilar VisionClaw IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar el código del proyecto
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Configurar Secrets.swift automáticamente
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXAMPLE_FILE=$(find . -name "Secrets.swift.example" | head -n 1)
          echo "Plantilla encontrada en: $EXAMPLE_FILE"
          cat "$EXAMPLE_FILE"
          TARGET_FILE="${EXAMPLE_FILE%.example}"
          cp "$EXAMPLE_FILE" "$TARGET_FILE"
          python3 -c '
          import os, re, sys
          key = os.environ["GEMINI_KEY"]
          target = sys.argv[1]
          with open(target, "r") as f:
              content = f.read()
          content = re.sub(r"(?i)(gemini[^=]*=\s*\")[^\"]*(\")", r"\g<1>" + key + r"\g<2>", content)
          with open(target, "w") as f:
              f.write(content)
          ' "$TARGET_FILE"

      - name: Compilar la app para iPhone sin firma
        run: |
          PROJ_PATH=$(find . -name "CameraAccess.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Compilando proyecto en: $PROJ_DIR"
          cd "$PROJ_DIR"
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tee build.log || (grep -E "error:|fatal:" build.log | tail -n 20; exit 1)

      - name: Empaquetar en archivo .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -path "*/Release-iphoneos/*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r VisionClaw.ipa Payload

      - name: Subir VisionClaw.ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-ipa
          path: VisionClaw.ipa

name: Compilar VisionClaw IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar el código del proyecto
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Configurar Secrets.swift automáticamente
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXAMPLE_FILE=$(find . -name "Secrets.swift.example" | head -n 1)
          echo "Plantilla encontrada en: $EXAMPLE_FILE"
          TARGET_FILE="${EXAMPLE_FILE%.example}"
          cp "$EXAMPLE_FILE" "$TARGET_FILE"
          python3 -c '
          import os, re, sys
          key = os.environ["GEMINI_KEY"]
          target = sys.argv[1]
          with open(target, "r") as f:
              content = f.read()
          content = re.sub(r"(?i)(gemini[^=]*=\s*\")[^\"]*(\")", r"\g<1>" + key + r"\g<2>", content)
          with open(target, "w") as f:
              f.write(content)
          ' "$TARGET_FILE"

      - name: Parchear LiveKitSession.swift y verificar líneas
        run: |
          python3 -c '
          import pathlib

          targets = list(pathlib.Path(".").rglob("LiveKitSession.swift"))
          print("Archivos LiveKitSession.swift encontrados:", [str(t) for t in targets])

          replacements = [
              ("track = LocalVideoTrack.createBufferTrack(", "track = await LocalVideoTrack.createBufferTrack("),
              ("track = LocalVideoTrack.createCameraTrack(", "track = await LocalVideoTrack.createCameraTrack("),
              ("let track = LocalVideoTrack.createBufferTrack(", "let track = await LocalVideoTrack.createBufferTrack("),
              ("let track = LocalVideoTrack.createCameraTrack(", "let track = await LocalVideoTrack.createCameraTrack("),
          ]

          for p in targets:
              raw = p.read_text(encoding="utf-8", errors="replace")
              updated = raw
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != raw:
                  p.write_text(updated, encoding="utf-8")
                  print("Se aplicaron cambios en:", p)
              else:
                  print("NO se aplicaron cambios en:", p)
                  lines = raw.splitlines()
                  for idx in [235, 236, 238, 239, 384, 385]:
                      if 0 <= idx < len(lines):
                          print(f"  Línea {idx+1}: {lines[idx]}")
          '

      - name: Compilar la app para iPhone sin firma
        run: |
          PROJ_PATH=$(find . -name "CameraAccess.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Compilando proyecto en: $PROJ_DIR"
          cd "$PROJ_DIR"
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            SWIFT_VERSION=5.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar en archivo .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -path "*/Release-iphoneos/*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r VisionClaw.ipa Payload

      - name: Subir VisionClaw.ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-ipa
          path: VisionClaw.ipa

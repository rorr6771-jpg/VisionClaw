name: Compilar VisionClaw IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar el código del proyecto
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Crear archivo Secrets.swift con tu API Key
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd samples/CameraAccess/CameraAccess
          cp Secrets.swift.example Secrets.swift
          python3 -c '
          import os, re
          key = os.environ["GEMINI_KEY"]
          with open("Secrets.swift", "r") as f:
              content = f.read()
          content = re.sub(r"(geminiAPIKey\s*=\s*\")[^\"]*(\")", r"\g<1>" + key + r"\g<2>", content)
          with open("Secrets.swift", "w") as f:
              f.write(content)
          '

      - name: Compilar la app para iPhone sin firma
        run: |
          cd samples/CameraAccess
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar en archivo .ipa
        run: |
          mkdir -p Payload
          cp -r samples/CameraAccess/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r VisionClaw.ipa Payload

      - name: Subir VisionClaw.ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-ipa
          path: VisionClaw.ipa

name: Compilar VisionClaw IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar el código del proyecto
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Configurar Secrets.swift automáticamente
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXAMPLE_FILE=$(find . -name "Secrets.swift.example" | head -n 1)
          echo "Plantilla encontrada en: $EXAMPLE_FILE"
          TARGET_FILE="${EXAMPLE_FILE%.example}"
          cp "$EXAMPLE_FILE" "$TARGET_FILE"
          python3 -c '
          import os, re, sys
          key = os.environ["GEMINI_KEY"]
          target = sys.argv[1]
          with open(target, "r") as f:
              content = f.read()
          content = re.sub(r"(?i)(gemini[^=]*=\s*\")[^\"]*(\")", r"\g<1>" + key + r"\g<2>", content)
          with open(target, "w") as f:
              f.write(content)
          ' "$TARGET_FILE"

      - name: Parchear LiveKitSession.swift y mostrar líneas
        run: |
          python3 -c '
          import pathlib

          targets = list(pathlib.Path(".").rglob("LiveKitSession.swift"))
          print("Archivos encontrados:", [str(t) for t in targets])

          for p in targets:
              text = p.read_text(encoding="utf-8", errors="replace")
              new_text = text.replace("LocalVideoTrack.createBufferTrack(", "await LocalVideoTrack.createBufferTrack(")
              new_text = new_text.replace("LocalVideoTrack.createCameraTrack(", "await LocalVideoTrack.createCameraTrack(")
              new_text = new_text.replace("await await ", "await ")
              p.write_text(new_text, encoding="utf-8")

              lines = new_text.splitlines()
              print(f"--- Líneas clave en {p} ---")
              for idx in list(range(233, 243)) + list(range(382, 390)):
                  if 0 <= idx < len(lines):
                      print(f"{idx+1}: {lines[idx]}")
          '

      - name: Compilar la app para iPhone sin firma
        run: |
          PROJ_PATH=$(find . -name "CameraAccess.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Compilando proyecto en: $PROJ_DIR"
          cd "$PROJ_DIR"
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar en archivo .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -path "*/Release-iphoneos/*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r VisionClaw.ipa Payload

      - name: Subir VisionClaw.ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-ipa
          path: VisionClaw.ipa

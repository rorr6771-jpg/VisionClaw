name: Build IPA sin firmar
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          cd samples/CameraAccess
          xcodebuild -list -project CameraAccess.xcodeproj
          xcodebuild -project CameraAccess.xcodeproj -scheme CameraAccess \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r CameraAccess.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-ipa
          path: samples/CameraAccess/CameraAccess.ipa
